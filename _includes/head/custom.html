<style>
  :root {
    --bg: #0A0A0C;
    --card-bg: #17171B;
    --card-border: rgba(255, 255, 255, 0.08);
    --text-muted: #9CA3AF;
    --accent: #8B5CF6;
    --accent-hover: #A78BFA;
    --accent-dark: #7C3AED;
  }

  body { background-color: var(--bg); }
  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }

  .masthead {
    background-color: var(--bg);
    border-bottom: 1px solid var(--card-border);
  }
  .site-title, .site-title:hover { color: var(--accent) !important; }
  .masthead__menu-item a { font-size: 0.92em; color: #D1D5DB; }
  .greedy-nav a:before,
  .greedy-nav .visible-links a:before { background: #ffffff !important; }
  .greedy-nav .visible-links a:hover { color: #ffffff; }
  .greedy-nav__toggle { color: var(--accent); }
  .navicon, .navicon::before, .navicon::after { background: #ffffff !important; }

  .page__title, .page__title a { color: var(--accent) !important; }
  .archive__item-title a { color: var(--accent); }
  .page__content, .page__content p, .page__content li { color: #D1D5DB; }
  p.excerpt { color: var(--text-muted); }

  .btn--primary, .btn--primary:visited {
    background-color: var(--accent) !important;
    color: #ffffff !important;
    font-weight: 600;
    border-radius: 6px;
  }
  .btn--primary:hover { background-color: var(--accent-dark) !important; }

  .author__urls a, .author__urls-btn { color: var(--accent); }
  .sidebar .author__name, .sidebar h3 { color: var(--accent); }

  .page__footer { background-color: var(--bg); border-top: 1px solid var(--card-border); }
  .page__footer a { color: var(--accent); }

  /* --- Table of contents sidebar: override the skin's default teal accent --- */
  .toc {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
  }
  .toc .nav__title {
    background: var(--accent) !important;
    color: #ffffff !important;
  }
  .toc__menu a {
    color: #D1D5DB;
  }
  .toc__menu a:hover {
    color: var(--accent);
  }
  .toc__menu .active a {
    color: #ffffff;
    background-color: var(--accent) !important;
  }

  ::selection { background: var(--accent); color: #ffffff; }

  /* --- Feature cards: dark panel styling, equal-height, one-line titles, 3-line clamped excerpts --- */
  .feature__wrapper {
    display: grid !important;
    grid-template-columns: repeat(2, 1fr) !important;
    align-items: stretch !important;
    gap: 1.25rem;
    max-width: 960px;
    margin-inline: auto;
    border-bottom: none;
  }
  .feature__wrapper::after { content: none !important; }
  .feature__wrapper .feature__item,
  .feature__wrapper .feature__item--left,
  .feature__wrapper .feature__item--center,
  .feature__wrapper .feature__item--right {
    float: none !important;
    width: auto !important;
    margin: 0 !important;
    clear: none !important;
  }
  @media (max-width: 420px) {
    .feature__wrapper {
      grid-template-columns: 1fr !important;
    }
  }
  .feature__item .archive__item,
  .feature__item--left .archive__item,
  .feature__item--center .archive__item,
  .feature__item--right .archive__item {
    height: 100%;
    display: flex;
    flex-direction: column;
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding-top: 0.85em;
    transition: border-color 0.15s ease;
    font-size: 0.9em;
  }
  .feature__item .archive__item:hover {
    border-color: rgba(139, 92, 246, 0.4);
  }
  .feature__item .archive__item-body {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding-inline: 0.9em;
  }
  .archive__item-title {
    color: #ffffff;
    font-size: 1em;
  }
  .archive__item-excerpt {
    color: var(--text-muted);
    font-size: 0.9em;
    flex: 1 1 auto;
    margin-bottom: 0.75em;
  }
  .feature__item .archive__item-body > p:last-child {
    margin-top: auto;
    margin-bottom: 0;
  }
  .feature__item .btn {
    padding: 0.4em 0.9em;
    font-size: 0.85em;
  }

  /* --- Wide data tables (e.g. Clarity report) --- */
  .table-scroll {
    overflow-x: auto;
    margin-bottom: 1.5em;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    background-color: var(--card-bg);
  }
  .table-scroll table {
    margin-bottom: 0;
    white-space: nowrap;
  }
  .table-scroll table td {
    white-space: normal;
    min-width: 160px;
  }
  tr.section-row td {
    background-color: rgba(139, 92, 246, 0.12);
    color: var(--accent-hover);
    white-space: nowrap !important;
  }
</style>
